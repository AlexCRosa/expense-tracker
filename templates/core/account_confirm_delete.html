{% extends "base.html" %}

{% block title %}Delete Account - Talon Expense Tracker{% endblock title %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete the account: <strong>{{ object.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'core:account_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
