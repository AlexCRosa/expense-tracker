{% extends "base.html" %}

{% block title %}Delete Expense - Talon Expense Tracker{% endblock title %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete this expense of <strong>${{ object.amount|floatformat:2 }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'core:expense_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
