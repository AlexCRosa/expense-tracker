{% extends "base.html" %}

{% block title %}Login - Talon Expense Tracker{% endblock title %}

{% block content %}
<div style="max-width: 30rem;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {% include "registration/_form_fields.html" %}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
    <p>No account yet? <a href="{% url 'accounts:signup' %}">Sign up</a>.</p>
</div>
{% endblock %}
