{% extends "base.html" %}

{% block title %}Login - Talon Expense Tracker{% endblock title %}

{% block content %}
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
{% endblock %}
